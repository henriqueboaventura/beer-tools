<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Versão maskable: conteúdo dentro da zona segura, porque o Android recorta o ícone -->
  <defs>
    <mask id="chave-boca">
      <rect x="-200" y="-300" width="400" height="600" fill="#fff"/>
      <rect x="-19" y="-222" width="38" height="74" fill="#000"/>
      <circle cx="0" cy="-150" r="19" fill="#000"/>
    </mask>
    <g id="chave">
      <circle cx="0" cy="-150" r="60"/>
      <rect x="-24" y="-150" width="48" height="290" rx="24"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="#0b0b0b"/>

  <g transform="translate(256 256) scale(0.84) translate(-270 -284)">
  <!-- caneco -->
  <g>
    <!-- alça -->
    <path d="M318 214h36a46 46 0 0 1 46 46v76a46 46 0 0 1-46 46h-36v-38h32a14 14 0 0 0 14-14v-64a14 14 0 0 0-14-14h-32z" fill="#e9e4d8"/>
    <!-- copo -->
    <rect x="112" y="170" width="214" height="262" rx="26" fill="#e9e4d8"/>
    <!-- cerveja -->
    <rect x="134" y="196" width="170" height="214" rx="12" fill="#f2a93b"/>
    <rect x="134" y="196" width="170" height="36" fill="#d98a1c"/>
    <!-- reflexos -->
    <rect x="160" y="248" width="16" height="136" rx="8" fill="#ffd27a"/>
    <!-- espuma -->
    <g fill="#ffffff">
      <circle cx="146" cy="170" r="40"/>
      <circle cx="202" cy="146" r="48"/>
      <circle cx="262" cy="152" r="44"/>
      <circle cx="306" cy="176" r="34"/>
      <rect x="118" y="160" width="202" height="46" rx="20"/>
    </g>
  </g>

  <!-- chave inglesa, na diagonal por cima do caneco (contorno preto para separar) -->
  <g transform="translate(352 346) rotate(45) scale(0.82)">
    <g mask="url(#chave-boca)">
      <use href="#chave" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="30" stroke-linejoin="round"/>
      <use href="#chave" fill="#b9bcc2"/>
      <rect x="-9" y="-80" width="18" height="190" rx="9" fill="#8e9299"/>
    </g>
  </g>
  </g>
</svg>
